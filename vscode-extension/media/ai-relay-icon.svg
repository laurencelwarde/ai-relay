<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#relayGrad)" />

  <!-- Left node (source provider) -->
  <circle cx="32" cy="64" r="14" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="2"/>
  <text x="32" y="69" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c4b5fd" text-anchor="middle">A</text>

  <!-- Right node (target provider) -->
  <circle cx="96" cy="64" r="14" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="2"/>
  <text x="96" y="69" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c4b5fd" text-anchor="middle">B</text>

  <!-- Relay arrow (baton pass) -->
  <path d="M 50 64 L 78 64" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <polygon points="78,64 70,58 70,70" fill="#34d399"/>

  <!-- Context dots flowing -->
  <circle cx="54" cy="64" r="3" fill="#22d3ee" opacity="0.9"/>
  <circle cx="62" cy="64" r="3" fill="#22d3ee" opacity="0.7"/>
  <circle cx="70" cy="64" r="3" fill="#34d399" opacity="0.5"/>

  <!-- Small circular arrows suggesting continuity -->
  <path d="M 64 38 A 20 20 0 0 1 84 50" stroke="#c4b5fd" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 64 90 A 20 20 0 0 1 44 78" stroke="#c4b5fd" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>